      id="canvas"
      tabindex="0"
      oncontextmenu="event.preventDefault()"

    <script type="text/javascript">
      var Module = {
        canvas: (function () {
          var c = document.getElementById("canvas");
          c.addEventListener("click", function () {
            c.focus();
          });
          window.addEventListener("load", function () {
            c.focus();
          });
          return c;
        })(),
      };
    </script>
